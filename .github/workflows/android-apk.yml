name: Build Android APK (Infdev Mobile Voxel Engine)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Dependencies & Build Web Assets
        run: |
          npm install
          npm run build

      - name: Initialize / Sync Capacitor Android
        run: |
          npx cap sync android || npx cap add android

      - name: Grant execute permission for gradlew
        run: |
          chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InfdevMobileVoxelEngine-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
