name: Build Android APK (Infdev Mobile Voxel Engine)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: DIAGNOSTIC - ANDROID STRUCTURE
        run: |
          echo "=== WORKSPACE & GIT INFO ==="
          pwd
          git rev-parse --abbrev-ref HEAD || true
          git rev-parse HEAD || true
          echo "=== ROOT CONTENTS ==="
          ls -la
          echo "=== ANDROID CONTENTS ==="
          ls -la android || true
          echo "=== ANDROID GRADLE WRAPPER CONTENTS ==="
          ls -la android/gradle/wrapper || true
          echo "=== SEARCHING ALL gradlew FILES ==="
          find . -maxdepth 4 -type f -name "gradlew"
          echo "=== SEARCHING ALL gradle-wrapper.properties FILES ==="
          find . -maxdepth 5 -type f -name "gradle-wrapper.properties"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 21 (Required by Capacitor 8.4.0 & AGP 8.13.0)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install NPM Dependencies & Build Web Assets
        run: |
          npm ci
          npm run build

      - name: Initialize or Sync Capacitor Android
        env:
          CI: true
        run: |
          if [ -f "android/gradlew" ] && [ -f "android/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Detected Capacitor Android project in android/. Running cap sync android..."
            npx cap sync android
          else
            echo "android/gradlew or gradle-wrapper.jar missing in checkout. Generating Capacitor Android project..."
            rm -rf android
            npx cap add android
          fi

      - name: Verify Gradle Wrapper and Grant Permission
        working-directory: android
        run: |
          echo "Current directory for Gradle:"
          pwd
          if [ ! -f "gradlew" ]; then
            echo "ERROR: gradlew not found inside android/ directory!"
            ls -la
            exit 1
          fi
          ls -la gradlew gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: InfdevMobileVoxelEngine-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
